
apiVersion: apps/v1
kind: Deployment

metadata:
  name: hospital-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hospital

  template:
    metadata:
      labels:
        app: hospital

    spec:
      containers:
        - name: hospital-container
          image: hospital-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80
